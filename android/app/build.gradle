apply plugin: 'com.android.application'

import groovy.json.JsonSlurper

// The version shown under You comes from package.json; Play's versionCode is made from it
// (1.2.3 → 10203), so bump package.json before each upload and the code goes up with it.
def appVersion = new JsonSlurper().parse(file('../../package.json')).version
def versionParts = appVersion.tokenize('.').collect { it.toInteger() }
def appVersionCode = versionParts[0] * 10000 + versionParts[1] * 100 + versionParts[2]

// The upload key for Play (docs/release.md). Kept outside the project and OneDrive: the path to its
// keystore.properties comes from GROVYN_KEYSTORE, or ~/.grovyn/keystore.properties. Without it the
// release build is unsigned and Play won't take it; debug builds don't need it.
def keystorePropsFile = file(System.getenv('GROVYN_KEYSTORE') ?: "${System.getProperty('user.home')}/.grovyn/keystore.properties")
def keystoreProps = new Properties()
if (keystorePropsFile.exists()) keystorePropsFile.withInputStream { keystoreProps.load(it) }

android {
    namespace = "app.grovyn"
    compileSdk = rootProject.ext.compileSdkVersion
    defaultConfig {
        applicationId "app.grovyn"
        minSdkVersion rootProject.ext.minSdkVersion
        targetSdkVersion rootProject.ext.targetSdkVersion
        versionCode appVersionCode
        versionName appVersion
        testInstrumentationRunner "androidx.test.runner.AndroidJUnitRunner"
        aaptOptions {
             // Files and dirs to omit from the packaged assets dir, modified to accommodate modern web apps.
             // Default: https://android.googlesource.com/platform/frameworks/base/+/282e181b58cf72b6ca770dc7ca5f91f135444502/tools/aapt/AaptAssets.cpp#61
            ignoreAssetsPattern = '!.svn:!.git:!.ds_store:!*.scc:.*:!CVS:!thumbs.db:!picasa.ini:!*~'
        }
    }
    signingConfigs {
        if (keystoreProps['storeFile']) {
            release {
                storeFile file(keystoreProps['storeFile'])
                storePassword keystoreProps['storePassword']
                keyAlias keystoreProps['keyAlias']
                keyPassword keystoreProps['keyPassword']
            }
        }
    }
    buildTypes {
        release {
            if (keystoreProps['storeFile']) signingConfig signingConfigs.release
            minifyEnabled false
            proguardFiles getDefaultProguardFile('proguard-android.txt'), 'proguard-rules.pro'
        }
    }
    buildFeatures {
        buildConfig = true
    }
    // Two versions of the app from the same code (docs/play-store-readiness.md):
    // `play` is the one on Google Play; `full` is installed by hand and also reads past bank SMS,
    // which Play allows only after a declaration and review. Its own ID lets both sit on one phone.
    flavorDimensions = ["store"]
    productFlavors {
        play {
            dimension "store"
            buildConfigField "boolean", "SMS", "false"
        }
        full {
            dimension "store"
            applicationIdSuffix ".full"
            versionNameSuffix "-full"
            buildConfigField "boolean", "SMS", "true"
        }
    }
}

repositories {
    flatDir{
        dirs '../capacitor-cordova-android-plugins/src/main/libs', 'libs'
    }
}

dependencies {
    implementation fileTree(include: ['*.jar'], dir: 'libs')
    implementation "androidx.appcompat:appcompat:$androidxAppCompatVersion"
    implementation "androidx.coordinatorlayout:coordinatorlayout:$androidxCoordinatorLayoutVersion"
    implementation "androidx.core:core-splashscreen:$coreSplashScreenVersion"
    implementation project(':capacitor-android')
    // Google sign-in through the phone's own account picker (DevicePlugin.googleSignIn).
    implementation "androidx.credentials:credentials:1.5.0"
    implementation "androidx.credentials:credentials-play-services-auth:1.5.0"
    implementation "com.google.android.libraries.identity.googleid:googleid:1.1.1"
    // The Budget lock: the phone's own fingerprint, face or screen lock (DevicePlugin.unlock).
    implementation "androidx.biometric:biometric:1.1.0"
    testImplementation "junit:junit:$junitVersion"
    androidTestImplementation "androidx.test.ext:junit:$androidxJunitVersion"
    androidTestImplementation "androidx.test.espresso:espresso-core:$androidxEspressoCoreVersion"
    implementation project(':capacitor-cordova-android-plugins')
}

apply from: 'capacitor.build.gradle'

try {
    def servicesJSON = file('google-services.json')
    if (servicesJSON.text) {
        apply plugin: 'com.google.gms.google-services'
    }
} catch(Exception e) {
    logger.info("google-services.json not found, google-services plugin not applied. Push Notifications won't work")
}
