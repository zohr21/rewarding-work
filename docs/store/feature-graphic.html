<!doctype html>
<html>
<!-- Play feature graphic, 1024x500. scripts/store-shots.mjs renders it to feature-graphic.png after the screenshots. -->
<head>
<meta charset="utf-8">
<style>
  @font-face { font-family: 'Bricolage Grotesque'; font-weight: 200 800; src: url('../../src/assets/fonts/bricolage-grotesque-latin-wght-normal.woff2') format('woff2-variations'); }
  @font-face { font-family: 'Instrument Sans'; font-weight: 400 700; src: url('../../src/assets/fonts/instrument-sans-latin-wght-normal.woff2') format('woff2-variations'); }
  html, body { margin: 0; width: 1024px; height: 500px; overflow: hidden; }
  body {
    background:
      radial-gradient(520px 380px at 78% 30%, rgba(242, 193, 78, 0.16), transparent 70%),
      radial-gradient(600px 420px at 10% 100%, rgba(143, 224, 174, 0.14), transparent 70%),
      #0e1512;
    color: #eef1ec;
    font-family: 'Instrument Sans', sans-serif;
    position: relative;
  }
  .copy { position: absolute; left: 72px; top: 50%; transform: translateY(-50%); width: 520px; }
  .brand { display: flex; align-items: center; gap: 16px; margin-bottom: 28px; }
  .brand svg { width: 64px; height: 64px; }
  .brand span { font-family: 'Bricolage Grotesque'; font-weight: 700; font-size: 44px; letter-spacing: -0.5px; }
  h1 { font-family: 'Bricolage Grotesque'; font-weight: 700; font-size: 58px; line-height: 1.02; margin: 0 0 20px; letter-spacing: -1px; }
  h1 em { font-style: normal; color: #8fe0ae; }
  p { font-size: 22px; line-height: 1.4; margin: 0; color: #b8c4bc; }
  .phone {
    position: absolute; right: 70px; top: 40px; width: 280px; height: 498px;
    border-radius: 36px; padding: 10px; background: #050806;
    box-shadow: 0 0 0 2px #2a3a31, 0 30px 80px rgba(0,0,0,0.6), 0 0 120px rgba(143,224,174,0.12);
    transform: rotate(4deg);
  }
  .phone img { width: 100%; height: 100%; object-fit: cover; object-position: top; border-radius: 28px; display: block; }
</style>
</head>
<body>
  <div class="copy">
    <div class="brand">
      <svg viewBox="0 0 64 64" aria-hidden="true">
        <g fill="#8fe0ae">
          <rect x="14" y="38" width="4" height="16" rx="2"/><circle cx="16" cy="35" r="6.5"/>
          <rect x="30" y="30" width="4" height="24" rx="2"/><circle cx="32" cy="25" r="9"/>
          <rect x="46" y="23" width="4" height="31" rx="2"/><circle cx="48" cy="17" r="7.5"/>
        </g>
        <circle fill="#f2c14e" cx="48" cy="17" r="2.75"/>
      </svg>
      <span>grovyn</span>
    </div>
    <h1>Focus a little.<br><em>Watch it grow.</em></h1>
    <p>A focus timer, tasks in small steps, and a grove that grows with every minute you put in.</p>
  </div>
  <div class="phone"><img src="01-today.png" alt=""></div>
</body>
</html>
